name: Codex Branch Code Analysis

on:
  push:
    branches:
      - preview
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  analyze-with-codex:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Fetch main branch for comparison
        run: |
          git fetch origin main:main || git fetch origin master:master || echo "Could not fetch main/master"
          
      - name: Determine base branch
        id: base-branch
        run: |
          if git show-ref --verify --quiet refs/heads/main; then
            echo "base=main" >> $GITHUB_OUTPUT
            echo "Base branch: main"
          elif git show-ref --verify --quiet refs/heads/master; then
            echo "base=master" >> $GITHUB_OUTPUT
            echo "Base branch: master"
          else
            echo "base=main" >> $GITHUB_OUTPUT
            echo "Defaulting to main"
          fi
          
      - name: Get changed files
        id: changed-files
        run: |
          BASE_BRANCH="${{ steps.base-branch.outputs.base }}"
          
          # Get list of changed files compared to base branch
          git diff --name-only $BASE_BRANCH...HEAD > changed_files.txt
          echo "Changed files compared to $BASE_BRANCH:"
          cat changed_files.txt
          
          # Get the actual diff
          git diff $BASE_BRANCH...HEAD > changes.diff
          
          # Count changes
          CHANGED_COUNT=$(wc -l < changed_files.txt | tr -d ' ')
          echo "changed_count=$CHANGED_COUNT" >> $GITHUB_OUTPUT
          echo "Total changed files: $CHANGED_COUNT"
          
      - name: Setup Python
        if: steps.changed-files.outputs.changed_count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        if: steps.changed-files.outputs.changed_count != '0'
        run: |
          pip install -r .github/scripts/requirements.txt
          
      - name: Run Codex Analysis
        if: steps.changed-files.outputs.changed_count != '0'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          BASE_BRANCH: ${{ steps.base-branch.outputs.base }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python .github/scripts/codex_analyzer.py
          
      - name: Create Issue with Analysis Results
        if: steps.changed-files.outputs.changed_count != '0' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Check if analysis results exist
            if (!fs.existsSync('analysis_results.json')) {
              console.log('No analysis results found, skipping issue creation');
              return;
            }
            
            // Read analysis results
            const results = JSON.parse(fs.readFileSync('analysis_results.json', 'utf8'));
            
            // Format the issue body
            let body = '## 🤖 Codex AI Code Analysis\n\n';
            body += `**Branch:** \`${{ github.ref_name }}\`\n`;
            body += `**Commit:** \`${{ github.sha }}\`\n`;
            body += `**Base:** \`${{ steps.base-branch.outputs.base }}\`\n`;
            body += `**Triggered by:** Push to preview branch\n\n`;
            body += '---\n\n';
            
            let hasIssues = false;
            
            for (const [category, analysis] of Object.entries(results)) {
              const emoji = analysis.issues_found ? '⚠️' : '✅';
              if (analysis.issues_found) hasIssues = true;
              
              body += `### ${emoji} ${category}\n\n`;
              body += `${analysis.summary}\n\n`;
              
              if (analysis.details && analysis.details.length > 0) {
                body += '<details>\n<summary>View Details</summary>\n\n';
                analysis.details.forEach(detail => {
                  body += `- ${detail}\n`;
                });
                body += '</details>\n\n';
              }
            }
            
            body += '\n---\n';
            body += `*Analysis powered by OpenAI Codex*\n`;
            body += `*Workflow run: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;
            
            // Create an issue with the results
            const title = hasIssues 
              ? `⚠️ Code Analysis: Issues found in preview branch` 
              : `✅ Code Analysis: No issues found in preview branch`;
            
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['code-analysis', 'preview-branch']
            });
            
            console.log(`Created issue #${issue.data.number}`);
            
      - name: Summary
        if: steps.changed-files.outputs.changed_count == '0'
        run: |
          echo "No changes detected compared to base branch. Skipping analysis."
